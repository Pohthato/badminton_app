[program:badminton_app]
command=/var/www/badminton_app/venv/bin/gunicorn -c deploy/gunicorn.conf.py app_v2:app
directory=/var/www/badminton_app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/badminton_app/err.log
stdout_logfile=/var/log/badminton_app/out.log
environment=MOONSHOT_API_KEY="%(ENV_MOONSHOT_API_KEY)s",REDIS_URL="redis://localhost:6379/0"

[program:badminton_worker]
command=/var/www/badminton_app/venv/bin/celery -A tasks worker --loglevel=info --concurrency=2
directory=/var/www/badminton_app
user=www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/badminton_app/celery_err.log
stdout_logfile=/var/log/badminton_app/celery_out.log
environment=MOONSHOT_API_KEY="%(ENV_MOONSHOT_API_KEY)s",REDIS_URL="redis://localhost:6379/0"

[program:badminton_beat]
command=/var/www/badminton_app/venv/bin/celery -A tasks beat --loglevel=info
directory=/var/www/badminton_app
user=www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/badminton_app/beat_err.log
stdout_logfile=/var/log/badminton_app/beat_out.log
